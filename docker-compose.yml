services:

  # ─── Laravel App (PHP-FPM) ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: business_website_app
    restart: unless-stopped
    volumes:
      - .:/var/www:delegated
      - business_website_vendor:/var/www/vendor
      - business_website_node_modules:/var/www/node_modules
      - business_website_public_build:/var/www/public/build
      - business_website_storage:/var/www/storage
      - business_website_cache:/var/www/bootstrap/cache
    environment:
      APP_ENV: ${APP_ENV:-local}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - business_website_network
      - business_website_shared_network

  # ─── Queue Worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: business_website_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www:delegated
      - business_website_vendor:/var/www/vendor
      - business_website_storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - business_website_network
      - business_website_shared_network

  # ─── Vite Dev Server ───────────────────────────────────────────────────────
  vite:
    image: node:20-alpine
    container_name: business_website_vite
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www:delegated
      - business_website_node_modules:/var/www/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - business_website_network
      - business_website_shared_network

  # ─── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: business_website_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www:delegated
      - business_website_public_build:/var/www/public/build
      - business_website_storage:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - business_website_network
      - business_website_shared_network

  # ─── MySQL 8.0 ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: business_website_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-business_website}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-business_website_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - business_website_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - business_website_network
      - business_website_shared_network

  # ─── phpMyAdmin ────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: business_website_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - business_website_network
      - business_website_shared_network

volumes:
  business_website_mysql_data:
  business_website_vendor:
  business_website_node_modules:
  business_website_public_build:
  business_website_storage:
  business_website_cache:

networks:
  business_website_network:
    driver: bridge
  business_website_shared_network:
    driver: bridge
    name: business_website_shared_network